[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iu-cxr-report-lora"
version = "0.1.0rc1"
description = "IU-only full-report LoRA inference for synthetic frontal chest radiographs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT for original software; model weights have separate terms"}
dependencies = [
  "torch>=2.6",
  "diffusers==0.36.0",
  "transformers==4.57.3",
  "peft==0.18.0",
  "accelerate==1.12.0",
  "huggingface-hub==0.36.0",
  "tokenizers==0.22.1",
  "safetensors==0.7.0",
  "ftfy==6.3.1",
  "numpy==2.1.3",
  "Pillow==11.3.0"
]

[project.urls]
Repository = "https://github.com/elfnrkck/iu-cxr-report-lora"

[project.scripts]
iu-cxr-generate = "iu_cxr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iu_cxr = ["data/*.json", "data/tokenizer/*"]

